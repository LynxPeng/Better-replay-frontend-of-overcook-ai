name: Build macOS room host

on:
  workflow_dispatch:
  push:
    branches: [codex/release-v0.2.1]
    paths:
      - ".github/workflows/macos-live-host.yml"
      - "scripts/*live-host*"
      - "scripts/check-live-records.py"

permissions:
  contents: read

jobs:
  macos-host:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: HumanCompatibleAI/overcooked_ai
          ref: 739950a079cdaed5a44fcc662efc40244c205d06
          path: upstream
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: live-build
          python-version: "3.10"
          channels: conda-forge
          channel-priority: strict
      - name: Prepare the host environment
        run: |
          git -C upstream apply ../patches/upstream-event-info.patch
          conda install -y 'pytorch=2.9.1=cpu_generic*' 'numpy=1.26.4' pip
          python -m pip install -c constraints-replay.txt ./upstream 'scipy==1.15.3' 'stable-baselines3==2.9.2' 'pyinstaller==6.16.0' pytest
          python -m pip install --no-deps -e .
          python -m pytest -q tests/test_live_host_entry.py
      - name: Freeze the host and collect notices
        run: bash scripts/build-live-host-macos.sh upstream output/macos-host
      - name: Exercise the bundled server and both models
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=v0.2.0-live-windows-preview
          archive="OvercookedLive-Windows-x64-$tag"
          gh release download "$tag" --pattern "$archive.zip"
          unzip -q "$archive.zip" "$archive/HostRuntime/Models/*" -d output
          rm "$archive.zip"
          python scripts/check-live-records.py --host output/macos-host/OvercookedHost/OvercookedHost \
            --models "output/$archive/HostRuntime/Models" --out output/host-check --rate 12
          COPYFILE_DISABLE=1 tar -czf "output/OvercookedHost-${{ matrix.arch }}.tar.gz" -C output/macos-host OvercookedHost
      - uses: actions/upload-artifact@v4
        with:
          name: macos-room-host-${{ matrix.arch }}
          path: |
            output/OvercookedHost-${{ matrix.arch }}.tar.gz
            output/host-check/summary.json
          if-no-files-found: error
