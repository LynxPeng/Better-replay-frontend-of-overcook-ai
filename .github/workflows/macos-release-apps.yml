name: Sign and publish the macOS live package

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published release to receive the signed package
        required: true
        type: string
      arm64_run:
        description: Build run ID for the Apple Silicon room host
        required: true
        type: string
      intel_run:
        description: Build run ID for the Intel room host
        required: true
        type: string
  push:
    branches: [codex/release-v0.2.1]
    paths: [".github/workflows/macos-release-apps.yml"]

permissions:
  actions: read
  contents: write

env:
  RELEASE_TAG: ${{ inputs.release_tag || 'v0.2.1' }}
  ARM64_RUN: ${{ inputs.arm64_run || '43818192029' }}
  INTEL_RUN: ${{ inputs.intel_run || '43821202014' }}

jobs:
  package:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Download the Unity app and the saved room hosts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          staging_tag="$RELEASE_TAG-mac-staging"
          test "$(gh release view "$staging_tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true
          gh release download "$staging_tag" --repo "$GITHUB_REPOSITORY" \
            --pattern "OvercookedLive-macOS-input-$RELEASE_TAG.zip" --dir inputs
          gh run download "$ARM64_RUN" --repo "$GITHUB_REPOSITORY" \
            --name macos-room-host-arm64 --dir inputs/arm64
          for attempt in {1..72}; do
            status="$(gh run view "$INTEL_RUN" --repo "$GITHUB_REPOSITORY" --json status,conclusion \
              --jq '[.status,.conclusion] | join(":")')"
            case "$status" in
              completed:success)
                gh run download "$INTEL_RUN" --repo "$GITHUB_REPOSITORY" \
                  --name macos-room-host-x86_64 --dir inputs/x86_64
                exit
                ;;
              completed:*) echo "Intel room host build ended with $status"; exit 1 ;;
            esac
            sleep 15
          done
          echo "Timed out waiting for the Intel build."
          exit 1

      - name: Assemble and sign the Universal app
        run: |
          folder="$(mktemp -d)"
          ditto -x -k "inputs/OvercookedLive-macOS-input-$RELEASE_TAG.zip" "$folder"
          app="$folder/OvercookedLive.app"
          plist="$app/Contents/Info.plist"
          runtime="$app/Contents/Resources/HostRuntime"
          for arch in arm64 x86_64; do
            mkdir -p "$runtime/$arch"
            tar -xzf "inputs/$arch/OvercookedHost-$arch.tar.gz" -C "$runtime/$arch" --strip-components=1
            host="$runtime/$arch/OvercookedHost"
            test -x "$host"
            test "$(lipo -archs "$host")" = "$arch"
            codesign --verify --strict "$host"
          done
          test -s "$runtime/Models/ppo-final.zip"
          test -s "$runtime/Models/sp-cramped-room.npz"
          executable="$(plutil -extract CFBundleExecutable raw -o - "$plist")"
          lipo "$app/Contents/MacOS/$executable" -verify_arch arm64 x86_64
          /usr/libexec/PlistBuddy -c "Set :LSMinimumSystemVersion 14.0" "$plist"
          /usr/libexec/PlistBuddy -c "Add :NSLocalNetworkUsageDescription string Join cooperative kitchen rooms on the local network." "$plist"
          codesign --force --sign - "$app"
          mkdir -p signed
          ditto -c -k --sequesterRsrc "$folder" "signed/OvercookedLive-macOS-Universal-$RELEASE_TAG.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: signed-macos-live-universal
          path: signed/*.zip
          compression-level: 0
          if-no-files-found: error

      - name: Verify the saved archive and add it to the existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="signed/OvercookedLive-macOS-Universal-$RELEASE_TAG.zip"
          roundtrip="$(mktemp -d)"
          ditto -x -k "$archive" "$roundtrip"
          app="$roundtrip/OvercookedLive.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          for arch in arm64 x86_64; do
            host="$app/Contents/Resources/HostRuntime/$arch/OvercookedHost"
            test -x "$host"
            codesign --verify --strict "$host"
          done
          test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = false
          shasum -a 256 "$archive"
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            "$archive#macOS Universal 完整联机版"
